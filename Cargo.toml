[package]
name = "script_editor_plugin"
version = "0.1.4"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "script_editor_plugin"

[features]
# Pulsar statically links this crate when it is used as a built-in editor.
# Dynamic plugin builds keep the loader ABI exports by default.
builtin = []

[dependencies]
# Plugin API
plugin_editor_api = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "f91bbba2b90ebad0afa6b9940ecd52da0430e326" }

# UI dependencies
# NOTE: gpui-ce rev must match the rev Pulsar-Native@f91bbba pins internally,
# and ui must match WGPUI-Component's own gpui-ce pin, or type mismatches occur.
gpui-ce = { git = "https://github.com/Far-Beyond-Pulsar/WGPUI", rev = "faf94adae251716ba5d6f3b510335395b19365e8" }
ui      = { git = "https://github.com/Far-Beyond-Pulsar/WGPUI-Component", rev = "07a0910b7f0004c31dfc7bab8ece03158636c541", features = ["tree-sitter-languages"] }
ui_common       = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "f91bbba2b90ebad0afa6b9940ecd52da0430e326" }
ui_types_common = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "f91bbba2b90ebad0afa6b9940ecd52da0430e326" }

# Engine dependencies
engine_state  = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "f91bbba2b90ebad0afa6b9940ecd52da0430e326" }
engine_backend     = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "f91bbba2b90ebad0afa6b9940ecd52da0430e326" }

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
parking_lot = "0.12"
tracing = "0.1"
log = "0.4"
anyhow = "1.0"
rust-i18n = "=4.2.1"
rust-i18n-macro = "=4.2.1"
rust-i18n-support = "=4.2.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"

# Async operations
futures = "0.3"

# Diff utilities
similar = "2.2"

# JSON schema derive
schemars = { version = "1.2", features = ["derive"] }

# Local development override: perf fixes are made directly on the sibling
# clone (branch perf/input-hot-paths @ 07a0910) until merged upstream.
[patch."https://github.com/Far-Beyond-Pulsar/WGPUI-Component"]
ui = { path = "../WGPUI-Component/crates/ui" }

[profile.dev.package."*"]
# Keep our crate fast to compile, but optimize heavy dependencies
# (gpui/wgpu/tree-sitter/simd) even in dev builds.
opt-level = 2

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
