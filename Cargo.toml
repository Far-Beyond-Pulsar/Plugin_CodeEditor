[package]
name = "script_editor_plugin"
version = "0.1.4"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "script_editor_plugin"

[features]
# Pulsar statically links this crate when it is used as a built-in editor.
# Dynamic plugin builds keep the loader ABI exports by default.
builtin = []

[dependencies]
# Plugin API
plugin_editor_api = { path = "../../../crates/core/plugin_editor_api" }

# UI dependencies. Path deps into the monorepo checkouts so this standalone
# plugin resolves the exact same gpui-ce / ui sources the rest of the
# monorepo builds (a git-dep version splits gpui into two crates with
# incompatible `Window`/`Panel` types: `gpui::Window` vs `gpui::window::Window`).
gpui-ce = { path = "../../../crates/ui/wgpui" }
ui      = { path = "../../../crates/ui/wgpui-component/crates/ui", features = ["tree-sitter-languages"] }
ui_common       = { path = "../../../crates/editor/ui_common" }
ui_types_common = { path = "../../../crates/editor/ui_types_common" }

# Engine dependencies
engine_state  = { path = "../../../crates/core/engine_state" }
engine_backend     = { path = "../../../crates/core/engine_backend" }

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
parking_lot = "0.12"
tracing = "0.1"
log = "0.4"
anyhow = "1.0"
rust-i18n = "=4.2.1"
rust-i18n-macro = "=4.2.1"
rust-i18n-support = "=4.2.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"

# Async operations
futures = "0.3"

# Diff utilities
similar = "2.2"

# JSON schema derive
schemars = { version = "1.2", features = ["derive"] }

# Mirrors the root workspace's `[patch]` matrix. This standalone project has no
# workspace of its own, so every crate that any transitive dependency pins via
# git (helio's SceneDB, the reflection/profiling/PSGC/PBGC/Graphy/config/toolbelt
# repos, WGPUI's internal gpui-ce pin, ...) must be re-pointed at the copy the
# monorepo currently ships, or Cargo compiles a second, incompatible copy and
# types split (duplicate World/ComponentId/Pod, separate profiler statics,
# mismatched Panel traits).
[patch."https://github.com/Far-Beyond-Pulsar/WGPUI"]
gpui-ce = { path = "../../../crates/ui/wgpui" }

[patch."https://github.com/Far-Beyond-Pulsar/WGPUI-Component"]
ui = { path = "../../../crates/ui/wgpui-component/crates/ui" }
ui-macros = { path = "../../../crates/ui/wgpui-component/crates/ui-macros" }

[patch."https://github.com/Far-Beyond-Pulsar/Pulsar-Native"]
gpui-ce          = { path = "../../../crates/ui/wgpui" }
ui               = { path = "../../../crates/ui/wgpui-component/crates/ui" }
ui-macros        = { path = "../../../crates/ui/wgpui-component/crates/ui-macros" }
plugin_editor_api = { path = "../../../crates/core/plugin_editor_api" }
ui_common         = { path = "../../../crates/editor/ui_common" }
ui_types_common   = { path = "../../../crates/editor/ui_types_common" }
engine_state      = { path = "../../../crates/core/engine_state" }
engine_backend    = { path = "../../../crates/core/engine_backend" }
profiling         = { path = "../../../crates/profiling" }

[patch."https://github.com/Far-Beyond-Pulsar/Pulsar-Profiling"]
profiling = { path = "../../../crates/profiling" }

[patch."https://github.com/Far-Beyond-Pulsar/PBGC"]
pbgc = { path = "../../../crates/third-party/pbgc" }

[patch."https://github.com/Far-Beyond-Pulsar/Graphy"]
graphy = { path = "../../../crates/third-party/graphy" }

[patch."https://github.com/Far-Beyond-Pulsar/PulsarConfig"]
pulsar-config = { path = "../../../crates/third-party/pulsar-config" }

[patch."https://github.com/Far-Beyond-Pulsar/ToolbeltRS"]
tool_registry = { path = "../../../crates/third-party/toolbelt/crates/tool_registry" }
tool_registry_macros = { path = "../../../crates/third-party/toolbelt/crates/tool_registry_macros" }

[patch."https://github.com/Far-Beyond-Pulsar/PSGC"]
psgc = { path = "../../../crates/third-party/psgc/crates/psgc" }
wgsl_std = { path = "../../../crates/third-party/psgc/crates/wgsl_std" }

[patch."https://github.com/Far-Beyond-Pulsar/Pulsar-Reflection"]
pulsar_reflection = { path = "../../../crates/third-party/pulsar-reflection/pulsar_reflection" }
pulsar_reflection_derive = { path = "../../../crates/third-party/pulsar-reflection/pulsar_reflection_derive" }

# SceneDB: patched (not merely pinned) because the Helio git dep still pins an
# older SceneDB rev internally, and a second, differing `pulsar_scenedb` in the
# graph splits the `World`/`ComponentId` types exchanged across the Helio seam.
# The patch VALUE uses the `//`-spelled URL: cargo refuses a patch that resolves
# to the exact same source, so the alternate spelling carries the pushed rev.
[patch."https://github.com/Far-Beyond-Pulsar/SceneDB"]
pulsar_scenedb = { git = "https://github.com//Far-Beyond-Pulsar/SceneDB", rev = "214cb5319fcef099f2413005e472d86aaf1046b3" }
pulsar_scenedb_derive = { git = "https://github.com//Far-Beyond-Pulsar/SceneDB", rev = "214cb5319fcef099f2413005e472d86aaf1046b3" }

[profile.dev.package."*"]
# Keep our crate fast to compile, but optimize heavy dependencies
# (gpui/wgpu/tree-sitter/simd) even in dev builds.
opt-level = 2

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }