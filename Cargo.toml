[package]
name = "script_editor_plugin"
version = "0.1.4"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "script_editor_plugin"

[features]
# Pulsar statically links this crate when it is used as a built-in editor.
# Dynamic plugin builds keep the loader ABI exports by default.
builtin = []

[dependencies]
# The plugin's descriptor and its editor provider's registration.
pulsar_plugins = { workspace = true }
plugin_manager = { workspace = true }
# Plugin API
plugin_editor_api = { workspace = true }

# UI dependencies. Path deps into the monorepo checkouts so this standalone
# plugin resolves the exact same gpui-ce / ui sources the rest of the
# monorepo builds (a git-dep version splits gpui into two crates with
# incompatible `Window`/`Panel` types: `gpui::Window` vs `gpui::window::Window`).
gpui-ce = { workspace = true }
ui      = { workspace = true, features = ["tree-sitter-languages"] }
wgpui-base = { workspace = true }
ui_common       = { workspace = true }
ui_types_common = { workspace = true }

# Keep Mockaco and WGPUI on the same tree-sitter 0.25-compatible API.
# The host adapter bridges clipboard/history/navigation on this API.
mockaco-gpui = { git = "https://github.com/Far-Beyond-Pulsar/Mockaco", rev = "e3bb37436ed36b0316cda1b059e4238a676afd70", features = ["native-wgpui"] }
mockaco-language = { git = "https://github.com/Far-Beyond-Pulsar/Mockaco", rev = "e3bb37436ed36b0316cda1b059e4238a676afd70" }
mockaco-core = { git = "https://github.com/Far-Beyond-Pulsar/Mockaco", rev = "e3bb37436ed36b0316cda1b059e4238a676afd70" }
mockaco-diff = { git = "https://github.com/Far-Beyond-Pulsar/Mockaco", rev = "e3bb37436ed36b0316cda1b059e4238a676afd70" }

# Engine dependencies
engine_state  = { workspace = true }
engine_backend     = { workspace = true }

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
parking_lot = "0.12"
tracing = "0.1"
log = "0.4"
anyhow = "1.0"
rust-i18n = "=4.2.1"
rust-i18n-macro = "=4.2.1"
rust-i18n-support = "=4.2.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"

# Async operations
futures = "0.3"

# Chat-panel tools
tool_registry = { workspace = true }

# Diff utilities
similar = "2.2"

# JSON schema derive
schemars = { version = "1.2", features = ["derive"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Headless tests drive real entities in a test window.
gpui-ce = { workspace = true, features = ["test-support"] }
