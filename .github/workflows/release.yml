name: Release

# Builds and releases this plugin's library for every platform on a version bump.
# The build is written once, in Pulsar-Native (.github/workflows/plugin-release.yml).

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
  workflow_dispatch:

jobs:
  release:
    uses: Far-Beyond-Pulsar/Pulsar-Native/.github/workflows/plugin-release.yml@main
    with:
      plugin_dir: plugins/vendor/code_editor
      # mockaco_language calls the tree-sitter grammar entry point `tree_sitter_rust`, which the macOS ui_dylib
      # does not yet export for the plugin to link (see .agents/BUILD_LESSONS.md).
      optional_platforms: macos-x86_64 macos-arm64
    permissions:
      contents: write
