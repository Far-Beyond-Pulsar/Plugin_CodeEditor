# A Rust package manifest, the TOML file you will edit most often.

[package]
name = "my_game_plugin"
version = "0.1.0"
edition = "2021"
description = "An example plugin crate"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Turns on the extra debug overlay.
debug_overlay = ["dep:tracing"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
